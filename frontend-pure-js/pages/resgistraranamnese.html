<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Anamnese | Clínica</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #283593;
        }

        label {
            font-weight: 600;
            margin-top: 15px;
            display: block;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            transition: .2s;
        }

        input:focus, textarea:focus {
            border-color: #283593;
            box-shadow: 0 0 4px rgba(63,81,181,0.5);
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #3949ab;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #283593;
        }

        .success {
            margin-top: 15px;
            color: #1b5e20;
            font-weight: bold;
        }

        .error {
            margin-top: 15px;
            color: #b71c1c;
            font-weight: bold;
        }
    </style>

</head>
<body>

<div class="container">
    <h1>Registrar Anamnese</h1>

    <label>ID do Paciente:</label>
    <input type="number" id="idPaciente" placeholder="Digite o ID do paciente">

    <label>Respostas da Anamnese:</label>
    <textarea id="respostas" rows="6" placeholder="Digite aqui as respostas completas da anamnese"></textarea>

    <button onclick="enviarAnamnese()">Registrar Anamnese</button>

    <div id="mensagem"></div>
</div>

<script>
    async function enviarAnamnese() {
        const idPaciente = document.getElementById("idPaciente").value;
        const respostas = document.getElementById("respostas").value;
        const mensagem = document.getElementById("mensagem");

        mensagem.innerHTML = "";

        if (!idPaciente || !respostas.trim()) {
            mensagem.innerHTML = "<p class='error'>Preencha todos os campos.</p>";
            return;
        }

        try {
            const response = await fetch("http://localhost:8080/api/medicos/registrar-anamnese", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    idPaciente: Number(idPaciente),
                    respostas: respostas
                })
            });

            const result = await response.text();

            if (response.ok) {
                mensagem.innerHTML = `<p class="success">${result}</p>`;
            } else {
                mensagem.innerHTML = `<p class="error">${result}</p>`;
            }

        } catch (err) {
            mensagem.innerHTML = `<p class="error">Erro: ${err.message}</p>`;
        }
    }
</script>

</body>
</html>
