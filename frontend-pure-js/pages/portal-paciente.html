<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Paciente - Dental Clinic</title>
    <style>
        :root { --primary: #4a90e2; --success: #2ecc71; --bg: #f4f7f6; --card-bg: #ffffff; }
        
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        
        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 500px; 
            display: flex; 
            flex-direction: column;
        }
        
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; font-size: 1.4rem; }
        
        label { font-weight: bold; color: #555; margin-top: 15px; font-size: 0.9rem; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-family: inherit;
        }

        button { 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            color: white; 
            font-weight: bold; 
            margin-top: 20px; 
            transition: 0.3s; 
        }

        .btn-azul { background-color: var(--primary); }
        .btn-azul:hover { background-color: #357abd; }

        .btn-verde { background-color: var(--success); }
        .btn-verde:hover { background-color: #27ae60; }

        /* CONSULTA ITEM */
        .consulta-list { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .consulta-item { 
            background: #f8f9fa; 
            border-left: 5px solid var(--primary); 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 4px; 
        }
        .date-badge { font-weight: bold; color: var(--primary); display: block; margin-bottom: 5px; }
        .detail { font-size: 0.9rem; color: #666; margin: 2px 0; }

        .status-msg { margin-top: 15px; text-align: center; font-weight: bold; display: none; }
        .success { color: var(--success); }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📅 Acompanhar Agenda</h2>
        <p style="color:#777; font-size:0.9rem;">Veja suas próximas consultas agendadas.</p>

        <label>Seu CPF:</label>
        <input type="text" id="cpfConsulta" placeholder="Ex: 11122233344">

        <button class="btn-azul" onclick="buscarConsultas()">🔍 Buscar Consultas Futuras</button>

        <div id="listaConsultas" class="consulta-list">
            <p style="text-align:center; color:#999; margin-top:20px;">Digite seu CPF para pesquisar.</p>
        </div>
    </div>

    <div class="card">
        <h2>📝 Preencher Ficha Médica</h2>
        <p style="color:#777; font-size:0.9rem;">Envie suas informações para análise médica.</p>

        <label>Seu CPF:</label>
        <input type="text" id="cpfAnamnese" placeholder="Ex: 11122233344">

        <label>Respostas (Alergias, doenças, histórico):</label>
        <textarea id="respostas" rows="6" placeholder="Ex: Sou alérgico a penicilina. Tenho diabetes tipo 2."></textarea>

        <button class="btn-verde" onclick="enviarAnamnese()">✅ Enviar Ficha</button>

        <div id="msgAnamnese" class="status-msg"></div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api/pacientes";

        // ============================================
        // 1. BUSCAR CONSULTAS (GET)
        // ============================================
        async function buscarConsultas() {
            const cpf = document.getElementById("cpfConsulta").value;
            const container = document.getElementById("listaConsultas");

            if(!cpf) { alert("Digite o CPF!"); return; }

            container.innerHTML = "<p style='text-align:center'>Carregando...</p>";

            try {
                const res = await fetch(`${API_BASE}/minhas-consultas?cpf=${cpf}`);
                
                if(res.ok) {
                    const consultas = await res.json();
                    
                    if(consultas.length === 0) {
                        container.innerHTML = "<p style='text-align:center'>Nenhuma consulta futura encontrada.</p>";
                        return;
                    }

                    container.innerHTML = ""; // Limpa lista
                    
                    consultas.forEach(c => {
                        // Formata a data
                        const dataObj = new Date(c.dataHora);
                        const dataFormatada = dataObj.toLocaleDateString('pt-BR') + " às " + dataObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                        
                        // Trata nulos
                        const medico = c.medico ? c.medico.nome : "A definir";
                        const servico = c.servico ? c.servico.nomeServico : "Geral";

                        const html = `
                            <div class="consulta-item">
                                <span class="date-badge">${dataFormatada}</span>
                                <div class="detail"><strong>Médico:</strong> Dr(a). ${medico}</div>
                                <div class="detail"><strong>Serviço:</strong> ${servico}</div>
                                <div class="detail"><strong>Status:</strong> ${c.status}</div>
                            </div>
                        `;
                        container.innerHTML += html;
                    });

                } else {
                    const erro = await res.text();
                    container.innerHTML = `<p style='color:red; text-align:center'>${erro}</p>`;
                }
            } catch(e) {
                container.innerHTML = "<p style='color:red; text-align:center'>Erro de conexão.</p>";
            }
        }

        // ============================================
        // 2. ENVIAR ANAMNESE (POST)
        // ============================================
        async function enviarAnamnese() {
            const cpf = document.getElementById("cpfAnamnese").value;
            const respostas = document.getElementById("respostas").value;
            const msgBox = document.getElementById("msgAnamnese");

            if(!cpf || !respostas) { alert("Preencha CPF e Respostas!"); return; }

            msgBox.style.display = 'block';
            msgBox.className = 'status-msg';
            msgBox.innerText = "Enviando...";

            try {
                const res = await fetch(`${API_BASE}/anamnese`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cpf: cpf, respostas: respostas })
                });

                if(res.ok) {
                    msgBox.className = 'status-msg success';
                    msgBox.innerText = "✅ Ficha enviada com sucesso! Vinculada ao seu prontuário.";
                    // Limpa o campo de texto
                    document.getElementById("respostas").value = "";
                } else {
                    const erro = await res.text();
                    msgBox.className = 'status-msg error';
                    msgBox.innerText = "❌ Erro: " + erro;
                }
            } catch(e) {
                msgBox.className = 'status-msg error';
                msgBox.innerText = "❌ Erro de conexão com o servidor.";
            }
        }
    </script>

</body>
</html>
