<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Dental Clinic API</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { color: #333; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; margin-top: 1rem; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; color: white; }
        .btn-prontuario { background-color: #007bff; }
        .btn-prontuario:hover { background-color: #0056b3; }
        .btn-anamnese { background-color: #28a745; }
        .btn-anamnese:hover { background-color: #1e7e34; }
        
        #resultado-area { margin-top: 2rem; background: #2d2d2d; color: #f8f8f2; padding: 1rem; border-radius: 4px; overflow-x: auto; min-height: 100px; display: none; }
        pre { margin: 0; font-family: 'Consolas', 'Monaco', monospace; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>

<div class="container">
    <h1>Consultador de Prontuário</h1>
    
    <div class="form-group">
        <label for="cpfInput">Digite o CPF do Paciente:</label>
        <input type="text" id="cpfInput" placeholder="Ex: 12345678900" maxlength="14">
        <small style="color: #888;">* Digite exatamente como está no banco (com ou sem pontuação)</small>
    </div>

    <div class="btn-group">
        <button class="btn-prontuario" onclick="buscarDados('consulta')">Consultar Prontuário</button>
        <button class="btn-anamnese" onclick="buscarDados('anamnese')">Consultar Anamnese</button>
    </div>

    <div id="resultado-area">
        <pre id="jsonOutput">Aguardando requisição...</pre>
    </div>
</div>

<script>
    async function buscarDados(endpoint) {
        const cpf = document.getElementById('cpfInput').value.trim();
        const outputArea = document.getElementById('resultado-area');
        const jsonOutput = document.getElementById('jsonOutput');

        if (!cpf) {
            alert("Por favor, digite um CPF.");
            return;
        }

        // Mostra a área de resultado e limpa
        outputArea.style.display = 'block';
        jsonOutput.textContent = "Carregando...";
        jsonOutput.className = '';

        try {
            // URL da sua API Spring Boot
            const url = `http://localhost:8080/api/prontuarios/${endpoint}/${cpf}`;
            
            console.log(`Fazendo requisição para: ${url}`); // Para debug no F12

            const response = await fetch(url);

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error("Registro não encontrado para este CPF.");
                } else {
                    throw new Error(`Erro no servidor: ${response.status}`);
                }
            }

            const data = await response.json();
            
            // Formata o JSON para ficar bonito na tela
            jsonOutput.textContent = JSON.stringify(data, null, 4);

        } catch (error) {
            jsonOutput.textContent = `Erro: ${error.message}`;
            jsonOutput.className = 'error';
            console.error(error);
        }
    }
</script>

</body>
</html>
