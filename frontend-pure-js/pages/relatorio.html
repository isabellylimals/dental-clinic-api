<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios Gerenciais - Dental Clinic</title>
    <style>
        :root { --primary: #007bff; --dark: #343a40; --bg: #f4f7f6; --success: #28a745; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 900px; 
        }
        
        h2 { 
            color: var(--dark); 
            border-bottom: 3px solid var(--primary); 
            padding-bottom: 10px; 
            margin-top: 0; 
        }

        /* GRID DE FILTROS */
        .filtros { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e9ecef;
        }
        
        .form-group { display: flex; flex-direction: column; }
        
        label { 
            font-weight: bold; 
            font-size: 13px; 
            color: #555; 
            margin-bottom: 5px; 
        }
        
        input, select { 
            padding: 10px; 
            border: 1px solid #ced4da; 
            border-radius: 4px; 
            font-size: 14px; 
        }

        /* BOTÃO */
        .btn-gerar {
            grid-column: span 4;
            background-color: var(--success); 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-gerar:hover { background-color: #218838; }

        /* ÁREA DO RELATÓRIO (RESULTADO) */
        .resultado-container {
            background-color: #1e1e1e; /* Fundo preto terminal */
            color: #00ff00; /* Verde Matrix */
            padding: 20px;
            border-radius: 5px;
            overflow-x: auto; /* Permite rolagem lateral se a tabela for grande */
            border: 1px solid #333;
            min-height: 300px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* FONTE MONOESPAÇADA É O SEGREDO DO ALINHAMENTO */
        pre { 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 14px; 
            white-space: pre; /* Mantém os espaços do Java */
            margin: 0; 
        }
        
        .loading { 
            color: #ffc107; 
            font-weight: bold; 
            display: none; 
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📊 Painel de Relatórios Administrativos</h2>

        <div class="filtros">
            <div class="form-group">
                <label>Data Início:</label>
                <input type="datetime-local" id="inicio">
            </div>

            <div class="form-group">
                <label>Data Fim:</label>
                <input type="datetime-local" id="fim">
            </div>

            <div class="form-group">
                <label>Médico (Opcional):</label>
                <select id="idMedico">
                    <option value="">-- Todos os Médicos --</option>
                    </select>
            </div>

            <div class="form-group">
                <label>Status (Opcional):</label>
                <select id="status">
                    <option value="">-- Todos --</option>
                    <option value="SOLICITADA">Solicitada</option>
                    <option value="CONFIRMADA">Confirmada</option>
                    <option value="REALIZADA">Realizada</option>
                    <option value="CANCELADA">Cancelada</option>
                </select>
            </div>

            <button class="btn-gerar" onclick="gerarRelatorio()">📄 Gerar Relatório</button>
        </div>

        <div class="resultado-container">
            <div id="loading" class="loading">⏳ Processando dados... aguarde...</div>
            <pre id="output">Selecione os filtros acima e clique em "Gerar Relatório".</pre>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api";

        window.onload = async function() {
            try {
                const response = await fetch(`${API_BASE}/usuarios/medicos`);
                
                if (response.ok) {
                    const medicos = await response.json();
                    const select = document.getElementById("idMedico");

                    if (medicos.length === 0) {
                        console.warn("Nenhum médico encontrado no banco.");
                    }

                    // Preenche o Select dinamicamente
                    medicos.forEach(medico => {
                        const option = document.createElement("option");
                        option.value = medico.idUsuario; // Valor = ID
                        option.text = `Dr(a). ${medico.nome}`; // Texto = Nome
                        select.appendChild(option);
                    });
                } else {
                    console.error("Erro ao buscar médicos: " + response.status);
                }
            } catch (error) {
                console.error("Erro de conexão ao carregar médicos:", error);
            }
        };

        async function gerarRelatorio() {
            const inicio = document.getElementById("inicio").value;
            const fim = document.getElementById("fim").value;
            const idMedico = document.getElementById("idMedico").value;
            const status = document.getElementById("status").value;
            
            let url = new URL(`${API_BASE}/administrador/relatorio`);
            
            if (inicio) url.searchParams.append("inicio", inicio + ":00"); 
            if (fim) url.searchParams.append("fim", fim + ":59");
            if (idMedico) url.searchParams.append("idMedico", idMedico);
            if (status) url.searchParams.append("status", status);

            
            const output = document.getElementById("output");
            const loading = document.getElementById("loading");
            
            output.innerText = "";
            loading.style.display = "block";

            try {
                const response = await fetch(url);
                
                if (response.ok) {
                    const textoRelatorio = await response.text();
                    output.innerText = textoRelatorio;
                } else {
                    output.innerText = "❌ Erro ao gerar relatório.\nStatus: " + response.status;
                }
            } catch (error) {
                console.error(error);
                output.innerText = "❌ Erro de conexão com o servidor.\nVerifique se o backend está rodando.";
            } finally {
                loading.style.display = "none";
            }
        }
    </script>

</body>
</html>
