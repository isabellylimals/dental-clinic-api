<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>

    <style>
        body { font-family: Arial; background: #f2f2f2; padding: 20px; }
        .card {
            width: 450px; margin: auto; padding: 20px;
            background: white; border-radius: 10px;
            box-shadow: 0 0 10px #0003;
        }
        input, select { width: 100%; padding: 8px; margin-bottom: 12px; }
        button {
            width: 100%; padding: 10px; background: #0077ff; color: white;
            border: none; border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #005fcc; }
        #msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Editar Usuário</h2>

    <label>ID do Usuário</label>
    <input type="number" id="idUsuario" placeholder="Ex: 1">

    <label>Nome</label>
    <input type="text" id="nome">

    <label>Email</label>
    <input type="email" id="email">

    <label>Senha</label>
    <input type="password" id="senha">

    <label>Telefone</label>
    <input type="text" id="telefone">

    <label>Tipo de Usuário</label>
    <select id="tipoUsuario">
        <option value="PACIENTE">Paciente</option>
        <option value="MEDICO">Médico</option>
        <option value="ADMINISTRADOR">Administrador</option>
    </select>

    <hr>

    <h3>Dados de Paciente</h3>

    <label>CPF</label>
    <input type="text" id="cpf">

    <label>Data de nascimento</label>
    <input type="date" id="dataNascimento">

    <label>Endereço</label>
    <input type="text" id="endereco">

    <hr>

    <h3>Dados de Médico</h3>

    <label>CRM</label>
    <input type="text" id="crm">

    <label>Especialidade</label>
    <input type="text" id="especialidade">

    <button onclick="editar()">Salvar Alterações</button>

    <p id="msg"></p>
</div>

<script>
async function editar() {
    const msg = document.getElementById("msg");
    msg.textContent = "Enviando...";

    const dados = {
        idUsuario: parseInt(document.getElementById("idUsuario").value),
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        senha: document.getElementById("senha").value,
        telefone: document.getElementById("telefone").value,
        tipoUsuario: document.getElementById("tipoUsuario").value,
        cpf: document.getElementById("cpf").value || null,
        dataNascimento: document.getElementById("dataNascimento").value || null,
        endereco: document.getElementById("endereco").value || null,
        crm: document.getElementById("crm").value || null,
        especialidade: document.getElementById("especialidade").value || null,
        stats: true
    };

    try {
        const resp = await fetch("http://localhost:8080/api/usuarios/editar", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        if (resp.ok) {
            msg.style.color = "green";
            msg.textContent = "Usuário atualizado com sucesso!";
        } else {
            const erro = await resp.text();
            msg.style.color = "red";
            msg.textContent = "Erro: " + erro;
        }

    } catch (e) {
        msg.style.color = "red";
        msg.textContent = "Falha ao conectar ao servidor.";
    }
}
</script>

</body>
</html>
